name: Compilar APK GuitarTheory

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false

      - name: Instalar Android API 35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir proyecto
        shell: bash
        run: |
          mkdir -p extracted
          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          echo "ZIP encontrado: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted

          SETTINGS="$(find extracted -type f -name settings.gradle.kts | head -n 1)"
          echo "Settings encontrado: $SETTINGS"

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "$PROJECT_DIR" > project_dir.txt

      - name: Ejecutar tests
        shell: bash
        run: |
          PROJECT_DIR="$(cat project_dir.txt)"
          cd "$PROJECT_DIR"
          gradle --no-daemon testDebugUnitTest

      - name: Compilar APK
        shell: bash
        run: |
          PROJECT_DIR="$(cat project_dir.txt)"
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: GuitarTheory-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
